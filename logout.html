<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signed Out — SoftGrowTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f46e5; --primary-light: #6366f1; --primary-dark: #3730a3;
      --success: #059669; --bg: #f8fafc; --surface: #ffffff;
      --border: #e2e8f0; --text: #0f172a; --muted: #64748b; --radius: 16px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.18; pointer-events: none;
    }
    body::before { width: 520px; height: 520px; background: var(--primary-light); top: -180px; left: -120px; }
    body::after  { width: 420px; height: 420px; background: #a855f7; bottom: -140px; right: -100px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(15,23,42,.08), 0 4px 16px rgba(15,23,42,.04);
      padding: 56px 48px 48px; max-width: 480px; width: 100%; text-align: center;
      animation: slideUp .45s cubic-bezier(.22,1,.36,1) both; position: relative; z-index: 1;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:36px; }
    .brand-icon {
      width:40px; height:40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius:10px; display:flex; align-items:center; justify-content:center;
    }
    .brand-icon svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; }
    .brand-name { font-size:1.25rem; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
    .brand-name span { color:var(--primary); }
    .icon-wrap {
      width:80px; height:80px; background:linear-gradient(135deg,#d1fae5,#a7f3d0); border-radius:50%;
      display:flex; align-items:center; justify-content:center; margin:0 auto 28px;
      animation: popIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from { opacity:0; transform:scale(.5); } to { opacity:1; transform:scale(1); } }
    .icon-wrap svg { width:40px; height:40px; }
    .title { font-size:1.625rem; font-weight:800; color:var(--text); letter-spacing:-.5px; margin-bottom:10px; line-height:1.25; }
    .subtitle { font-size:.9375rem; color:var(--muted); line-height:1.6; margin-bottom:32px; }
    .divider { height:1px; background:var(--border); margin:0 -8px 28px; }
    .countdown-wrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:28px; font-size:.85rem; color:var(--muted); }
    .ring { position:relative; width:32px; height:32px; flex-shrink:0; }
    .ring svg { width:32px; height:32px; transform:rotate(-90deg); }
    .ring circle { fill:none; stroke-width:3; }
    .ring .track { stroke:#e2e8f0; }
    .ring .progress { stroke:var(--primary); stroke-linecap:round; stroke-dasharray:88; stroke-dashoffset:0; transition:stroke-dashoffset 1s linear; }
    .ring .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; color:var(--primary); }
    .actions { display:flex; flex-direction:column; gap:12px; }
    .btn {
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:14px 24px; border-radius:10px; font-size:.9375rem; font-weight:600;
      text-decoration:none; cursor:pointer; border:none; transition:all .18s ease; line-height:1;
    }
    .btn-primary {
      background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
      color:#fff; box-shadow:0 4px 16px rgba(79,70,229,.35);
    }
    .btn-primary:hover { box-shadow:0 6px 24px rgba(79,70,229,.5); transform:translateY(-1px); }
    .btn-outline { background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
    .btn-outline:hover { background:#eef2ff; }
    .btn svg { width:18px; height:18px; flex-shrink:0; }
    .footer-note { margin-top:28px; font-size:.8125rem; color:var(--muted); }
    .footer-note a { color:var(--primary); text-decoration:none; font-weight:500; }
    .footer-note a:hover { text-decoration:underline; }
    @media (max-width:480px) { .card { padding:40px 24px 36px; } .title { font-size:1.375rem; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <span class="brand-name">SoftGrow<span>Tech</span></span>
    </div>
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 class="title">You've been signed out</h1>
    <p class="subtitle">Your session has ended securely.<br>All your progress has been saved.</p>
    <div class="divider"></div>
    <div class="countdown-wrap">
      <div class="ring">
        <svg viewBox="0 0 32 32">
          <circle class="track" cx="16" cy="16" r="14"/>
          <circle class="progress" id="progressRing" cx="16" cy="16" r="14"/>
        </svg>
        <div class="num" id="countNum">5</div>
      </div>
      <span>Redirecting to sign-up in <strong id="countText">5</strong> seconds&hellip;</span>
    </div>
    <div class="actions">
      <a href="login.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign Back In
      </a>
      <a href="register.html" class="btn btn-outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Create New Account
      </a>
    </div>
    <p class="footer-note">Having trouble? <a href="login.html">Go to login page</a></p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Safety guard: redirect logged-in users to dashboard
    (function() {
      try {
        const raw = localStorage.getItem('interntrack_current_user');
        if (raw) {
          const u = JSON.parse(raw);
          if (u && u.id) { window.location.replace('dashboard.html'); return; }
        }
      } catch(e) {}
    })();

    // Circular countdown + auto-redirect
    var DURATION = 5;
    var circumference = 2 * Math.PI * 14;
    var ring = document.getElementById('progressRing');
    var countNum = document.getElementById('countNum');
    var countText = document.getElementById('countText');

    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = 0;

    var remaining = DURATION;
    var timer = setInterval(function() {
      remaining--;
      countNum.textContent = remaining;
      countText.textContent = remaining;
      var offset = circumference * (1 - remaining / DURATION);
      ring.style.strokeDashoffset = offset;
      if (remaining <= 0) {
        clearInterval(timer);
        window.location.href = 'register.html';
      }
    }, 1000);

    document.querySelectorAll('.btn').forEach(function(btn) {
      btn.addEventListener('click', function() { clearInterval(timer); });
    });
  </script>
</body>
</html>
